[project]
name = "policy-support-agent"
version = "0.1.0"
description = "A source-grounded GitHub policy support agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
compatible = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/policy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
